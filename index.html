
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Macro Total</title>

  <style>
    @font-face {
      font-family: "SF Pro Display";
      src: url("./SF-Pro-Display-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: "SF Pro Display", sans-serif;
      background: #fff;
      color: #171717;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      padding: 16px 14px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    main {
      width: 100%;
      max-width: 760px;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #totals {
      flex: 0 0 auto;
      min-height: 1.5em;
      margin: 0 0 12px;
      font-size: clamp(1.65rem, 6vw, 2.2rem);
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    #entries {
      display: block;
      flex: 1 1 0;
      width: 100%;
      min-height: 0;
      padding: 14px;
      border: 1px solid #c9c9c9;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: 16px/1.5 "SF Pro Display", sans-serif;
      resize: none;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scroll-margin: 0;
    }

    #entries:focus,
    button:focus-visible,
    #includeTotals:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: -3px;
    }

    .actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #f5f5f5;
      color: #171717;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      background: #e8e8e8;
    }

    #copy {
      background: #171717;
      color: #fff;
      border-color: #171717;
    }

    #copy:active {
      background: #383838;
    }

    .include-totals {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 0 4px;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #includeTotals {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: #171717;
      cursor: pointer;
      flex: 0 0 auto;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      #totals {
        margin-bottom: 10px;
      }

      #entries {
        padding: 12px;
      }

      .actions {
        gap: 8px;
      }

      button {
        padding-left: 14px;
        padding-right: 14px;
      }

      .include-totals {
        gap: 6px;
        font-size: 13px;
      }
    }

    @media (max-height: 400px) {
      body {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      #totals {
        font-size: 1.4rem;
        margin-bottom: 6px;
      }

      .actions {
        padding-top: 6px;
      }

      button {
        min-height: 36px;
        padding: 6px 12px;
      }

      .include-totals {
        min-height: 36px;
      }
    }
  </style>
</head>

<body>
  <main>
    <p id="totals" aria-live="polite" aria-atomic="true">0</p>

    <textarea
      id="entries"
      aria-label="Food entries and macro numbers"
      placeholder="E.g.
white rice - 100k, 22C, 2P
pb - 190k - 16F, 7P, 6C, 2B
broccoli - 60k, 10C, 8p
240K - 45P - 200g raw chicken breast
375k - 67.5c, 10p (1 cup oatmeal)
honey - 60k, 17c
70k, 17c (1 cup berries)"
      spellcheck="false"
      autofocus
    ></textarea>

    <div class="actions">
      <button id="clear" type="button">Clear</button>
      <button id="copy" type="button">Copy Text</button>

      <label class="include-totals" for="includeTotals">
        <input
          type="checkbox"
          id="includeTotals"
        >
        Include totals
      </label>
    </div>
  </main>

  <script>
    "use strict";

    const entriesInput = document.getElementById("entries");
    const totalsDisplay = document.getElementById("totals");
    const clearButton = document.getElementById("clear");
    const copyButton = document.getElementById("copy");
    const includeTotalsCheckbox = document.getElementById("includeTotals");

    function calculateTotals(text) {
      const textWithoutParentheses = text.replace(/\([^)]*\)/g, " ");
      const normalizedText = textWithoutParentheses.toUpperCase();

      const totals = {
        calories: 0,
        P: 0,
        C: 0,
        F: 0,
        B: 0
      };

      const numberPattern = /(?<![\d.])\d+(?:\.\d+)?/g;
      let match;

      while ((match = numberPattern.exec(normalizedText)) !== null) {
        const number = Number(match[0]);
        const suffixStart = match.index + match[0].length;
        const nextCharacter = normalizedText[suffixStart] || "";
        const characterAfterSuffix = normalizedText[suffixStart + 1] || "";

        if (
          ["P", "C", "F", "B"].includes(nextCharacter) &&
          !/[A-Z]/.test(characterAfterSuffix)
        ) {
          totals[nextCharacter] += number;
        } else if (
          nextCharacter === "K" &&
          !/[A-Z]/.test(characterAfterSuffix)
        ) {
          totals.calories += number;
        } else if (
          nextCharacter === "" ||
          !/[A-Z]/.test(nextCharacter)
        ) {
          totals.calories += number;
        }
      }

      return totals;
    }

    function formatNumber(number) {
      return Number(number.toFixed(10)).toString();
    }

    function updateTotals() {
      const totals = calculateTotals(entriesInput.value);
      const displayedTotals = [];

      if (totals.calories !== 0) {
        displayedTotals.push(formatNumber(totals.calories));
      }

      for (const macro of ["P", "C", "F", "B"]) {
        if (totals[macro] !== 0) {
          displayedTotals.push(
            `${formatNumber(totals[macro])}${macro}`
          );
        }
      }

      totalsDisplay.textContent = displayedTotals.length
        ? displayedTotals.join(", ")
        : "0";
    }

    entriesInput.addEventListener("input", updateTotals);

    clearButton.addEventListener("click", () => {
      entriesInput.value = "";
      updateTotals();
      entriesInput.focus({ preventScroll: true });
    });

    copyButton.addEventListener("click", async () => {
      const entries = entriesInput.value;
      const summary = totalsDisplay.textContent.trim();

      const text = includeTotalsCheckbox.checked
        ? `${summary}\n\n${entries}`
        : entries;

      try {
        await navigator.clipboard.writeText(text);
      } catch {
        // Fallback for browsers without Clipboard API access.
        const copyArea = document.createElement("textarea");
        copyArea.value = text;
        copyArea.setAttribute("readonly", "");
        copyArea.style.position = "fixed";
        copyArea.style.opacity = "0";
        copyArea.style.pointerEvents = "none";

        document.body.appendChild(copyArea);
        copyArea.select();

        const copied = document.execCommand("copy");
        document.body.removeChild(copyArea);

        if (!copied) {
          copyButton.textContent = "Copy Failed";
          setTimeout(() => {
            copyButton.textContent = "Copy Text";
          }, 1500);
          return;
        }
      }

      copyButton.textContent = "Copied!";
      setTimeout(() => {
        copyButton.textContent = "Copy Text";
      }, 1500);
    });

    // Prevent focus from moving the page when the textarea is selected.
    entriesInput.addEventListener("focus", () => {
      window.scrollTo(0, 0);
    });

    updateTotals();
  </script>
</body>
</html>
